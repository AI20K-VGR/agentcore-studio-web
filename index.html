<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentCore Studio — Canvas (scaffold)</title>
    <!-- Font tự host qua @fontsource (src/main.tsx) — không còn gọi fonts.googleapis.com/
         fonts.gstatic.com, xem finding #4 review AIE-1 (web#5). -->
    <script>
      // Đặt data-theme TRƯỚC khi React mount — tránh nháy sáng/tối 1 khung hình lúc tải trang.
      // Ưu tiên lựa chọn đã lưu (localStorage); chưa có thì theo prefers-color-scheme hệ điều hành.
      (function () {
        var stored = localStorage.getItem("theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
