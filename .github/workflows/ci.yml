# CI cho repo con `agentcore-studio-web` — STANDALONE, KHÁC 6 repo Python.
#
# Web KHÔNG thuộc uv workspace (root pyproject [tool.uv.workspace].exclude = ["apps/web"]).
# Nó là app Vite + React Flow độc lập, nói chuyện với studio API qua HTTP — không import
# contracts, không nằm trong uv.lock. Vì vậy CI này TỰ ĐỦ:
#   • KHÔNG cần Phương án B / reconstruct workspace
#   • KHÔNG cần PAT / secret (không clone repo private nào khác)
#   • pnpm install + tsc --noEmit + vite build (script `pnpm build`), rồi `pnpm test` (Vitest,
#     thêm ở web#18) rồi `pnpm check-parity` (D14, kit#97 review dholmes0207) — khoá graphLint.ts
#     TS không lệch phán quyết với `graph_lint()` Python ngay trên PR, không chỉ chạy tay lúc dev.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check-parity
