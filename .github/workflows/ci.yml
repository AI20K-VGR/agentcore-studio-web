# CI cho repo con `agentcore-studio-web` — STANDALONE, KHÁC 6 repo Python.
#
# Web KHÔNG thuộc uv workspace (root pyproject [tool.uv.workspace].exclude = ["apps/web"]).
# Nó là app Vite + React Flow độc lập, nói chuyện với studio API qua HTTP — không import
# contracts, không nằm trong uv.lock. Vì vậy CI này TỰ ĐỦ:
#   • KHÔNG cần Phương án B / reconstruct workspace
#   • KHÔNG cần PAT / secret (không clone repo private nào khác)
#   • pnpm install + tsc --noEmit + vite build (script `pnpm build`), rồi `pnpm test` (Vitest,
#     thêm ở web#18) rồi `pnpm check-parity` (D14, kit#97 review dholmes0207) — khoá graphLint.ts
#     TS không lệch phán quyết với `graph_lint()` Python ngay trên PR, không chỉ chạy tay lúc dev.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # web#23: pnpm 9 không đọc `overrides` từ pnpm-workspace.yaml (bỏ qua âm thầm, không
          # warning) — vỡ ERR_PNPM_LOCKFILE_CONFIG_MISMATCH khi package.json không còn giữ bản
          # sao override. pnpm 10 là bản tối thiểu đọc đúng field này (đã verify tại chỗ); không
          # bump lên 11 để tránh rủi ro tái phát policy minimumReleaseAge (xem pnpm-workspace.yaml).
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check-parity

  # web#23: `build` job trên ghim pnpm 9, không bao giờ thấy warning "no longer read by
  # pnpm" (chỉ pnpm 10+ mới in ra khi migrate settings ra khỏi package.json). Job riêng này
  # chạy pnpm mới hơn (khớp máy dev, hiện 11.x) CHỈ để bắt warning đó — không build/test gì —
  # để một pin/setting bị âm thầm bỏ qua không còn có thể lọt qua mà không có bước nào đỏ.
  pnpm-settings-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm (latest major, to catch settings pnpm no longer reads)
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fail if pnpm warns about ignored package.json settings
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/pnpm-install.log
          if grep -q "no longer read by pnpm" /tmp/pnpm-install.log; then
            echo "::error::package.json has settings pnpm no longer reads — move them to pnpm-workspace.yaml (see https://pnpm.io/settings)"
            exit 1
          fi
